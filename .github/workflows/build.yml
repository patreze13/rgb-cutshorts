name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev ffmpeg
        pip install --upgrade buildozer Cython virtualenv

    - name: Aceitar Licenças do Android SDK
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compilar APK Debug com Assinatura Fixa
      run: |
        yes | buildozer -v android debug

    - name: Preparar APK para Download
      run: |
        mkdir -p saida
        find bin/ -name "*.apk" -exec cp {} saida/RGB_CutShorts.apk \;

    - name: Publicar Release com o APK Pronto
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.${{ github.run_number }}
        name: RGB CutShorts v1.${{ github.run_number }}
        files: saida/RGB_CutShorts.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
