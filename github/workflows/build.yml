name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Buildozer e Dependências
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg
        pip install --upgrade buildozer Cython virtualenv

    - name: Criar Chave Fixa de Assinatura (Keystore)
      # Essa chave gerada garante que toda nova versão seja reconhecida como atualização
      run: |
        keytool -genkey -v -keystore rgb_release.keystore -alias rgbkey -keyalg RSA -keysize 2048 -validity 10000 -storepass rgbshorts123 -keypass rgbshorts123 -dname "CN=RGBCutShorts, OU=Dev, O=RGB, L=BR, S=BA, C=BR"

    - name: Compilar APK
      run: |
        buildozer android release

    - name: Assinar o APK para permitir Atualização
      run: |
        APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore rgb_release.keystore -storepass rgbshorts123 -keypass rgbshorts123 $APK_PATH rgbkey
        mv $APK_PATH bin/RGB_CutShorts.apk

    - name: Publicar Release com o APK Pronto
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.${{ github.run_number }}
        name: RGB CutShorts v1.${{ github.run_number }}
        files: bin/RGB_CutShorts.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
